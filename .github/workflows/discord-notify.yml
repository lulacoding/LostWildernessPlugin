name: 📣 Notify Discord on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:   # run manually from Actions tab

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get commit info (for manual run)
        id: commit
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --format='%an')" >> $GITHUB_OUTPUT
          echo "url=https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(git log -1 --format='%cI')" >> $GITHUB_OUTPUT

      - name: Discord Webhook Action
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "🛠 New commit on `${{ github.ref_name }}`"
          embed-url: ${{ github.event.head_commit.url || steps.commit.outputs.url }}
          embed-description: |
            ${{ github.event.head_commit.message || steps.commit.outputs.message }}
          embed-footer-text: "by ${{ github.event.head_commit.author.name || steps.commit.outputs.author || github.actor }}"
          embed-timestamp: ${{ github.event.head_commit.timestamp || steps.commit.outputs.timestamp }}
          embed-color: 3066993
