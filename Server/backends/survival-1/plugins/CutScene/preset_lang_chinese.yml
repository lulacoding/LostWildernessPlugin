BlockBreak:
  Line1: 选择一个方块，当被破坏时会触发此过场动画！
  Line2: 此方块被破坏时将激活此过场动画！
  Line3: 激活
  Line4: 未激活
Join:
  Line1: 切换是否在加入服务器时播放该场景。
  Line2: 当加入服务器时是否播放该场景。
  Line3: 资源包加载完成后播放
  Line4: 激活
  Line5: 未激活
  Line6: 当前延迟
  Line7: 激活
  Line8: 未激活
Walk:
  Line1: 选择一个方块，当玩家踩上去时激活该过场动画。
  Line2: 当玩家在其上行走时触发此场景。
  Line3: 激活
  Line4: 未激活
Chest:
  Line1: 切换是否在打开箱子时播放该场景。
  Line2: 打开箱子时是否播放该场景。
  Line3: 激活
  Line4: 未激活
TeleportEnd:
  Line1: 设置过场动画结束后玩家的传送位置。
  Line2: 过场结束后将传送到该位置。
  Line3: 激活
  Line4: 未激活
  Line5: 传送至过场动画开始位置
  Line6: 激活
  Line7: 未激活
Near:
  Line1: 当玩家靠近某个位置时
  Line2: 将播放此过场动画。
  Line3: 与位置的距离达到触发要求
  Line4: 激活
  Line5: 未激活
Animation:
  Line1: 切换是否在开始过场动画前播放动画。
  Line2: 在过场动画开始前播放动画。
Once:
  Line1: 切换是否每位玩家只能观看一次此场景。
  Line2: 每位玩家仅可观看一次！
  Line3: 激活
  Line4: 未激活
Song:
  Line1: 在过场动画中播放音乐。
  Line2: 当前歌曲
  Line3: 激活
  Line4: 未激活
Action:
  Line1: 配置在过场动画中执行的操作，
  Line2: 如标题显示或命令执行。
Chunk:
  Line1: 推荐用途：
  Line2: 此选项适用于大型地图上的过场动画。确保所有
  Line3: 玩家当前位置周围的区块都被加载。
  Line4: 重要性说明：
  Line5: 默认情况下，仅加载起始点附近的区块。如果过场移动到
  Line6: 没有其他玩家的区块中，该区块不会加载，从而中断体验。
  Line7: 启用此选项可提前加载这些区块，
  Line8: 但可能影响过场动画的流畅性。
  Line9: 自定义：
  Line10: 你可以通过调整间隔设置来配置加载频率。
  Line11: 区块加载间隔
  Line12: 间隔
  Line13: 激活
  Line14: 未激活
Blind:
  Line1: 切换玩家是否获得短暂的失明效果。
  Line2: 给予玩家失明效果。
  Line3: 激活
  Line4: 未激活
Particle:
  Line1: 切换玩家是否能看到飞舞的粒子效果。
  Line2: 周围飞舞的粒子是否可见。
  Line3: 选择的粒子：
Indi:
  Line1: 控制玩家观看过场动画位置的时长
  Line2: 以及过渡至下一个位置的过渡方式。
Pitch:
  Line1: 点击切换是否包含Pitch角度
  Line2: 默认只包含Yaw角度。
  Line3: 点击切换：
Hide:
  Line1: '将观看过场动画的玩家隐藏于其他玩家视野中 '
  Line2: '或将其他玩家从观看者视野中隐藏 '
Transition:
  Line1: 配置当位置切换到下一个位置时的过渡方式。
  Line2: 即将切换时的过渡效果。
  Line3: 当前过渡方式
  Line4: 仅适用于默认路径样式。
ArmorStand:
  Line1: 切换过场动画中玩家是否能看到盔甲架。
  Line2: 是否显示盔甲架实体。
  Line3: 状态
Scoreboard:
  Line1: 切换过场动画中玩家是否能看到记分板。
  Line2: 是否显示记分板。
  Line3: 警告！这可能在某些情况下导致意外行为。
  Line4: 状态
HideChat:
  Line1: 切换过场动画中的玩家是否应该
  Line2: 停止接收来自其他玩家的聊天消息。
Endless:
  Line1: 如果启用此选项，过场动画将不会
  Line2: 自动结束，必须手动停止。
