Chunk:
  Line1: 'Recommended Use:'
  Line2: This option is ideal for cutscenes on §clarge maps§7. It ensures that all
  Line3: chunks around the player's current location in the cutscene are loaded.
  Line4: 'Why This Matters:'
  Line5: By default, only chunks near the starting point of the cutscene will load.
    If the cutscene moves to a
  Line6: chunk where no other players are present, that chunk won't load, which can
    disrupt the experience.
  Line7: Enabling this option ensures those chunks load ahead of time,
  Line8: but it may negatively affect the smoothness of the cutscene.
  Line9: 'Customization:'
  Line10: You can configure how frequently this loading occurs by adjusting the interval
    settings.
  Line11: Chunk loading in
  Line12: intervals.
  Line13: Active
  Line14: Inactive
